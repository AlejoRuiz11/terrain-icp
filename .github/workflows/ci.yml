name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: msvc
            exe: build/msvc-release/terrain-icp.exe
          - os: ubuntu-latest   # Ubuntu 24.04: g++ is GCC 13
            preset: gcc
            exe: build/gcc-release/terrain-icp
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install CMake and Ninja
        run: |
          uv tool install cmake
          uv tool install ninja

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test (GoogleTest)
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      # pytest drives the executable many times (vertical step, trim sweep): use an optimised build for it.
      - name: Configure and build (Release, for pytest)
        run: |
          cmake --preset ${{ matrix.preset }}-release
          cmake --build --preset ${{ matrix.preset }}-release --target terrain-icp

      - name: Test (pytest)
        env:
          TERRAIN_ICP_EXE: ${{ github.workspace }}/${{ matrix.exe }}
        run: |
          uv sync --project python --locked
          uv run --project python pytest python/tests
